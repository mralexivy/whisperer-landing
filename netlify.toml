[build]
  command = "npm run build"
  publish = "build"

# Cache Next.js build cache between deploys (speeds up builds)
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".next/cache"]

[[redirects]]
  from = "https://www.whispererapp.com/*"
  to = "https://whispererapp.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.whispererapp.com/*"
  to = "https://whispererapp.com/:splat"
  status = 301
  force = true

[[redirects]]
